<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bike_it</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 🔝 Top navigation -->
  <header>
    <div class="user-nav">
      <button onclick="navigate('PA')">PA</button>
      <button onclick="navigate('Hubert')">Hubert</button>
      <button onclick="navigate('Comparison')">Comparison</button>
    </div>

    <div class="district-nav" id="districtNav"></div>
  </header>

  <div class="top-section">

    <!-- LEFT: stats -->
    <img id="bar_pic" class="side-bar" />

    <!-- RIGHT: main content -->
    <div class="main-container">

      <!-- MAIN IMAGE -->
      <div class="image-container" id="imageContainer">
        <img id="main_pic" />
        <button class="reset-view-btn" onclick="resetView()">⟳ Reset</button>
      </div>

      <!-- DATE SLIDER -->
      <div class="date-slider-container">

        <div id="dateLabel" class="date-label">
          Latest
        </div>

        <input
          type="range"
          id="dateSlider"
          min="0"
          max="0"
          value="0"
          step="1"
        />

        <div id="dateTicks" class="date-ticks"></div>

      </div>

    </div>

  </div>

  <!-- COMPARISON -->
  <div id="comparison_section" class="comparison-container" style="display: none;">

    <div class="comparison-column">

      <div style="display: flex; align-items: center;">
        <img id="comp_left" style="width: 70%;" />
        <img id="bar_pa" style="width: 25%; margin-left: 5px;" />
      </div>

    </div>

    <div class="comparison-column">

      <div style="display: flex; align-items: center; flex-direction: row-reverse;">
        <img id="comp_right" style="width: 70%;" />
        <img id="bar_hubert" style="width: 25%; margin-right: 5px;" />
      </div>

    </div>

  </div>

  <!-- TABLE STATS -->
  <div class="table_stats">
    <img id="table_stats" />
  </div>

  <!-- TIMESERIES -->
  <div class="timeseries">
    <img id="timeseries" />
  </div>

  <!-- DISTRICT GRID -->
  <div class="district-grid" id="districtGrid"></div>

  <script src="functions.js"></script>

</body>
</html>
